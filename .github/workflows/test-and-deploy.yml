name: Build, Test, and Deploy
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'docs/pm/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'docs/pm/**'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  NODE_VERSION: '20'

jobs:
  typecheck:
    name: Lint & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run typecheck

  deploy_preview:
    name: Deploy Preview
    needs: typecheck
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Create Preview Database
        id: create-db
        run: |
          # Use predictable database name (no random suffix)
          DB_NAME="leantracker-preview-pr-${{ github.event.number }}"

          echo "Using database name: $DB_NAME"

          # Delete existing database if it exists (fresh database per commit)
          echo "Deleting existing database (if exists)..."
          npx wrangler d1 delete "$DB_NAME" -y || echo "No existing database to delete"

          echo "Creating fresh database: $DB_NAME"
          npx wrangler d1 create $DB_NAME

          # Fetch the new database ID
          DB_ID=$(npx wrangler d1 info $DB_NAME --json | jq -r '.uuid')

          # Output for subsequent steps
          echo "db_id=$DB_ID" >> $GITHUB_OUTPUT
          echo "db_name=$DB_NAME" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Patch Wrangler Config
        run: |
          # Use the dynamic DB name and ID from the creation step's output
          DB_NAME="${{ steps.create-db.outputs.db_name }}"
          DB_ID="${{ steps.create-db.outputs.db_id }}"

          echo "Creating wrangler.preview.jsonc with DB_NAME=$DB_NAME and DB_ID=$DB_ID"

          echo "Files in current directory:"
          ls -la

          echo "Original wrangler.jsonc d1_databases section:"
          grep -A 3 -B 1 "d1_databases" wrangler.jsonc

          # Swap the id on the preview DB line first (matched by name), then the name
          cp wrangler.jsonc wrangler.preview.jsonc
          sed -i -E "/\"database_name\": \"leantracker-preview\"/ s/\"database_id\": \"[^\"]+\"/\"database_id\": \"$DB_ID\"/" wrangler.preview.jsonc
          sed -i "s/\"database_name\": \"leantracker-preview\"/\"database_name\": \"$DB_NAME\"/g" wrangler.preview.jsonc

          echo "Updated wrangler.preview.jsonc d1_databases section:"
          grep -A 3 -B 1 "d1_databases" wrangler.preview.jsonc

          echo "Testing wrangler config validation:"
          npx wrangler d1 list --config wrangler.preview.jsonc || echo "Config validation failed"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run Migrations on Preview DB
        run: |
          DB_NAME="${{ steps.create-db.outputs.db_name }}"
          echo "Running migrations on database: $DB_NAME"
          npx wrangler d1 migrations apply "$DB_NAME" --remote --env preview --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Preview Environment
        run: |
          npm run build
          npx wrangler versions upload \
            --env preview \
            --preview-alias pr-${{ github.event.number }} \
            --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Preview deployment')
            );

            const commentBody = `🚀 **Preview deployment ready!**

            Preview URL: https://pr-${{ github.event.number }}-leantracker-preview.willsmithte.workers.dev

            This preview will be updated automatically when you push new commits to this PR.`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

  cleanup_preview:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    steps:
      - name: Delete Preview Database
        run: |
          DB_NAME="leantracker-preview-pr-${{ github.event.number }}"
          echo "Deleting database: $DB_NAME"
          # Use -y to confirm deletion in a non-interactive environment
          npx wrangler d1 delete "$DB_NAME" -y || echo "DB not found or already deleted"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy_prod:
    name: Deploy to Production
    needs: typecheck
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run Production Database Migrations
        run: npx wrangler d1 migrations apply leantracker --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Preview Environment
        run: |
          npm run build
          npx wrangler deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Production Environment (Cloudflare)
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
